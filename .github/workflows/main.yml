name: PixelOS Natrium Build

on:
  workflow_dispatch:  # Allows manual build trigger

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # Set timeout to 6 hours

    steps:
      - name: Setup Git
        run: |
          git config --global user.email "emchovasilev127@gmail.com"
          git config --global user.name "krEmch0"

      - name: Update System and Install Dependencies
        run: |
          sudo apt update && sudo apt upgrade -y
          sudo apt install -y git ccache automake lzop bison g++-multilib gperf \
            libxml2-utils make zlib1g-dev unzip flex curl libncurses5-dev \
            openjdk-11-jdk python3
          sudo apt clean

      - name: Initialize Repo
        run: |
          mkdir -p ~/android && cd ~/android
          curl https://storage.googleapis.com/git-repo-downloads/repo > repo
          chmod a+x repo
          ./repo init -u https://github.com/PixelOS-AOSP/manifest -b fifteen
          ./repo sync -j$(nproc) --force-sync --no-tags --no-clone-bundle

      - name: Clone Device, Kernel, Vendor, and Hardware Trees
        run: |
          cd ~/android
          
          # Clone device tree (natrium)
          git clone https://github.com/krEmch0/android_device_xiaomi_natrium.git -b fifteen device/xiaomi/natrium
          
          # Clone common device tree (msm8996-common)
          git clone https://github.com/krEmch0/android_device_xiaomi_msm8996-common.git -b fifteen device/xiaomi/msm8996-common
          
          # Clone kernel
          git clone https://github.com/krEmch0/android_kernel_xiaomi_msm8996.git -b fifteen kernel/xiaomi/msm8996
          
          # Clone vendor natrium
          git clone https://github.com/TheMuppets/proprietary_vendor_xiaomi_natrium.git -b lineage-22.1 vendor/xiaomi/natrium
          
          # Clone vendor msm8996-common
          git clone https://github.com/TheMuppets/proprietary_vendor_xiaomi_msm8996-common.git -b lineage-22.1 vendor/xiaomi/msm8996-common
          
          # Clone hardware Xiaomi
          git clone https://github.com/PixelOS-AOSP/hardware_xiaomi.git -b fifteen hardware/xiaomi

      - name: Setup Build Configuration
        run: |
          cd ~/android
          export USE_CCACHE=1
          ccache -M 100G
          source build/envsetup.sh
          breakfast natrium

      - name: Build ROM
        run: |
          cd ~/android
          mka bacon -j$(nproc)

      - name: Upload ROM
        uses: actions/upload-artifact@v4  # Updated to v4
        with:
          name: PixelOS-Natrium
          path: ~/android/out/target/product/natrium/*.zip
